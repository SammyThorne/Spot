<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- base plate with the bottom edge GNOME icons use -->
  <rect x="12" y="16" width="104" height="100" rx="22" fill="#1a5fb4"/>
  <rect x="12" y="12" width="104" height="100" rx="22" fill="url(#bg)"/>
  <!-- magnifier -->
  <circle cx="56" cy="54" r="23" fill="url(#lens)" stroke="#ffffff" stroke-width="9"/>
  <path d="M73 71 L92 90" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- spark -->
  <path d="M94 26 l3.5 8.5 l8.5 3.5 l-8.5 3.5 l-3.5 8.5 l-3.5 -8.5 l-8.5 -3.5 l8.5 -3.5 z" fill="#f8e45c"/>
